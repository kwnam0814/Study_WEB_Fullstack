<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWeb Shop - 홈</title>
    <style>
        /* 기본 리셋 및 폰트 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* 내비게이션 바 스타일 */
        .navbar {
            background: #2c3e50; /* 어두운 네이비 */
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative; /* 오버레이 z-index 기준 */
            z-index: 1000; /* 메뉴가 다른 요소 위에 오도록 */
        }

        .nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* 가운데 정렬 */
        }

        .nav-item {
            position: relative; /* 드롭다운 메뉴 위치 기준 */
            margin: 0 20px;
        }

        .nav-item > a {
            color: white;
            text-decoration: none;
            padding: 10px 0;
            display: block;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-item > a:hover {
            color: #ecf0f1; /* 밝은 회색으로 변경 */
        }

        /* 드롭다운 메뉴 스타일 (초기 숨김) */
        .dropdown {
            position: absolute;
            top: 100%; /* 부모 메뉴 바로 아래 */
            left: 50%; /* 중앙 정렬을 위한 기준 */
            transform: translateX(-50%) translateY(10px); /* 중앙 정렬 + 살짝 아래에서 시작 */
            background: #34495e; /* 네비게이션 바보다 살짝 밝게 */
            list-style: none;
            margin: 0;
            padding: 10px 0;
            min-width: 180px;
            border-radius: 5px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-out; /* 부드러운 애니메이션 */
            z-index: 999; /* 메뉴보다 오버레이가 아래 */
        }

        .dropdown li a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            white-space: nowrap; /* 글자가 줄바꿈되지 않도록 */
            transition: background-color 0.2s ease;
        }

        .dropdown li a:hover {
            background-color: #4a627a; /* 호버 시 배경색 변경 */
        }

        /* 드롭다운 메뉴 활성화 시 */
        .nav-item.active .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* 메인 콘텐츠 스타일 (샘플) */
        .main-content {
            padding: 50px 20px;
            text-align: center;
        }

        /* 오버레이 스타일 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 반투명 검은색 */
            backdrop-filter: blur(2px); /* 배경 블러 효과 (옵션) */
            z-index: 900; /* 메뉴와 콘텐츠 사이에 위치 */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link-toggle">서비스 소개</a>
                <ul class="dropdown">
                    <li><a href="#">기능 1</a></li>
                    <li><a href="#">기능 2</a></li>
                    <li><a href="#">기능 3</a></li>
                </ul>
            </li>
            <li class="nav-item"><a href="#">커뮤니티</a></li>
            <li class="nav-item"><a href="#">자료실</a></li>
            <li class="nav-item">
                <a href="#" class="nav-link-toggle">내 계정</a>
                <ul class="dropdown">
                    <li><a href="#">마이페이지</a></li>
                    <li><a href="#">설정</a></li>
                    <li><a href="/admin/login">관리자 로그인</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="main-content">
        <h1>StudyWeb Shop에 오신 것을 환영합니다!</h1>
        <p>이곳은 학습 자료와 생산성 도구를 제공하는 온라인 공간입니다.</p>
        <p>상단 메뉴를 통해 다양한 서비스를 경험해보세요.</p>
        <img src="https://via.placeholder.com/600x300?text=StudyWeb+Shop+Main+Image" alt="StudyWeb Shop 메인 이미지">
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            const overlay = document.getElementById('overlay');
            let activeDropdown = null; // 현재 열려있는 드롭다운을 추적

            navItems.forEach(item => {
                const toggleLink = item.querySelector('.nav-link-toggle'); // 드롭다운을 여는 링크
                const dropdown = item.querySelector('.dropdown');

                // 드롭다운이 있는 항목에만 이벤트 리스너 추가
                if (dropdown) {
                    item.addEventListener('mouseenter', () => {
                        // 다른 드롭다운이 열려있다면 닫기
                        if (activeDropdown && activeDropdown !== item) {
                            activeDropdown.classList.remove('active');
                        }
                        item.classList.add('active'); // 현재 드롭다운 열기
                        overlay.classList.add('active'); // 오버레이 활성화
                        activeDropdown = item; // 현재 열린 드롭다운으로 설정
                    });

                    item.addEventListener('mouseleave', () => {
                        // 마우스가 item을 벗어났을 때 바로 닫지 않고 약간의 딜레이
                        // (커서가 드롭다운 안으로 이동할 시간 확보)
                        setTimeout(() => {
                            if (!item.matches(':hover')) { // 다시 item 위로 마우스가 안 돌아왔다면
                                item.classList.remove('active');
                                if (activeDropdown === item) {
                                    activeDropdown = null; // 닫혔으니 초기화
                                    // 모든 드롭다운이 닫혔을 때만 오버레이 비활성화
                                    const anyDropdownOpen = document.querySelector('.nav-item.active');
                                    if (!anyDropdownOpen) {
                                        overlay.classList.remove('active');
                                    }
                                }
                            }
                        }, 200); // 200ms 딜레이
                    });

                    // 드롭다운 링크 자체를 클릭했을 때 페이지 이동 방지 (선택 사항)
                    if (toggleLink) {
                        toggleLink.addEventListener('click', (e) => {
                            if (dropdown) { // 드롭다운이 있는 경우에만 기본 동작 방지
                                e.preventDefault();
                            }
                            // 클릭 시 바로 열리게 하려면 여기서 item.classList.add('active') 추가 가능
                        });
                    }
                }
            });

            // 오버레이 클릭 시 모든 드롭다운 닫기
            overlay.addEventListener('click', () => {
                navItems.forEach(item => item.classList.remove('active'));
                overlay.classList.remove('active');
                activeDropdown = null;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header><h2>숙소 예약하기</h2></header>

    <main>
        <form action="#">
            <div>
                <label for="checkin">체크인:</label>
                <input type="date" id="checkin" name="checkin">
            </div>

            <div>
                <label for="checkout">체크아웃:</label>
                <input type="date" id="checkout" name="checkout">
            </div>

            <div>
                <label for="adult">성인:</label>
                <input type="number" name="adults" id="adult" min="1">
            </div>
            
            <div>
                <label for="children">어린이:</label>
                <input type="number" name="child" id="children">
            </div>

            <div>
                선호객실타입
                <input type="radio" value="standard" name="room" id="standard">
                <label for="standard">스탠다드</label>
                <input type="radio" value="delux" name="room" id="delux">
                <label for="delux">디럭스</label>
                <input type="radio" value="sweet" name="room" id="sweet">
                <label for="sweet">스위트</label>
            </div>

            <div>
                <label for="content">요청 사항:</label>
                <textarea
                id="content"
                name="content"
                rows="2"
                cols="20"
                placeholder="특별히 요청하고 싶은 내용을 적어주세요"></textarea>
            </div>

            <!-- 폼 제출 버튼 -->
            <button type="submit">예약하기</button>
        </form>
    </main>
    
</body>
</html>
